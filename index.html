<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompteur P34</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --border-color: #334155;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }
        h1 { margin: 0; font-size: 1.5rem; color: var(--accent-color); }
        .btn {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { background-color: var(--accent-hover); }
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        input, select {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 6px;
            flex: 1;
            min-width: 150px;
        }
        
        /* Structure de classement par Artistes et sous-catégories */
        .artist-group {
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--card-bg);
            overflow: hidden;
        }
        .artist-header {
            background-color: #273548;
            padding: 12px 18px;
            font-weight: bold;
            color: var(--accent-color);
            font-size: 1.15rem;
            border-bottom: 1px solid var(--border-color);
        }
        .songs-sublist {
            display: flex;
            flex-direction: column;
        }
        .song-card {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .song-card:last-child {
            border-bottom: none;
        }
        .song-card:hover { background-color: #2a3952; }
        .song-info h3 { margin: 0 0 3px 0; font-size: 1.05rem; }
        .song-info p { margin: 0; font-size: 0.8rem; color: #94a3b8; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎵 Prompteur P34</h1>
        <a href="admin.html" class="btn">Mode Édition / Admin</a>
    </header>

    <div class="filters">
        <input type="text" id="searchInput" placeholder="Rechercher une chanson ou un artiste...">
        <select id="styleFilter">
            <option value="">Tous les styles</option>
        </select>
        <select id="langFilter">
            <option value="">Toutes les langues</option>
        </select>
    </div>

    <div class="song-list" id="songList">
        <!-- Les chansons s'afficheront ici dynamiquement -->
        <p style="color: #94a3b8; text-align: center;">Chargement des chansons...</p>
    </div>
</div>

<script>
    let songs = [];

    async function loadSongs() {
        try {
            const response = await fetch('songs.json');
            if (!response.ok) throw new Error("Fichier songs.json introuvable");
            songs = await response.json();
            
            // On associe chaque chanson à son index d'origine AVANT de trier
            songs = songs.map((song, originalIndex) => ({ ...song, originalIndex }));

            displaySongs(songs);
            populateFilters(songs);
        } catch (e) {
            document.getElementById('songList').innerHTML = `
                <div style="background-color: #1e293b; padding: 20px; border-radius: 8px; text-align: center; border: 1px dashed #334155;">
                    <p style="margin-bottom: 10px;">Aucune chanson trouvée ou fichier <b>songs.json</b> manquant.</p>
                    <a href="admin.html" class="btn">Créer mes premières chansons</a>
                </div>
            `;
        }
    }

    function displaySongs(songsToDisplay) {
        const list = document.getElementById('songList');
        if (songsToDisplay.length === 0) {
            list.innerHTML = '<p style="text-align: center; color: #94a3b8;">Aucune chanson ne correspond à vos critères.</p>';
            return;
        }

        // Tri principal par Artiste (alphabétique)
        const sortedSongs = [...songsToDisplay].sort((a, b) => {
            const artistCompare = a.artist.localeCompare(b.artist, 'fr', { sensitivity: 'base' });
            if (artistCompare !== 0) return artistCompare;
            return a.title.localeCompare(b.title, 'fr', { sensitivity: 'base' });
        });

        // Regroupement par artiste pour l'affichage en sous-catégories
        const groupedByArtist = {};
        sortedSongs.forEach(song => {
            if (!groupedByArtist[song.artist]) {
                groupedByArtist[song.artist] = [];
            }
            groupedByArtist[song.artist].push(song);
        });

        let html = '';
        for (const [artist, artistSongs] of Object.entries(groupedByArtist)) {
            // Tri des chansons de l'artiste par titre alphabétique
            artistSongs.sort((a, b) => a.title.localeCompare(b.title, 'fr', { sensitivity: 'base' }));

            html += `
                <div class="artist-group">
                    <div class="artist-header">🎤 ${artist}</div>
                    <div class="songs-sublist">
            `;

            artistSongs.forEach(song => {
                html += `
                    <div class="song-card" onclick="window.location.href='prompter.html?id=${song.originalIndex}'">
                        <div class="song-info">
                            <h3>🎵 ${song.title}</h3>
                            <p><i>${song.style || 'Pop'}</i> • [${song.lang || 'FR'}]</p>
                        </div>
                        <span class="btn" style="padding: 6px 12px; font-size: 0.85rem;">Chanter ▶</span>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
            `;
        }

        list.innerHTML = html;
    }

    function populateFilters(data) {
        const styles = [...new Set(data.map(s => s.style).filter(Boolean))].sort();
        const langs = [...new Set(data.map(s => s.lang).filter(Boolean))].sort();

        const styleSelect = document.getElementById('styleFilter');
        styles.forEach(s => styleSelect.innerHTML += `<option value="${s}">${s}</option>`);

        const langSelect = document.getElementById('langFilter');
        langs.forEach(l => langSelect.innerHTML += `<option value="${l}">${l}</option>`);
    }

    // Filtrage dynamique
    document.getElementById('searchInput').addEventListener('input', filterSongs);
    document.getElementById('styleFilter').addEventListener('change', filterSongs);
    document.getElementById('langFilter').addEventListener('change', filterSongs);

    function filterSongs() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const style = document.getElementById('styleFilter').value;
        const lang = document.getElementById('langFilter').value;

        const filtered = songs.filter(s => {
            const matchSearch = (s.title + ' ' + s.artist).toLowerCase().includes(search);
            const matchStyle = !style || s.style === style;
            const matchLang = !lang || s.lang === lang;
            return matchSearch && matchStyle && matchLang;
        });

        displaySongs(filtered);
    }

    loadSongs();
</script>

</body>
</html>
