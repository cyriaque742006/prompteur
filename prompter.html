<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompteur - Lecture</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --text-color: #f8fafc;
            --chord-color: #38bdf8;
            --accent-color: #38bdf8;
            --panel-bg: rgba(15, 23, 42, 0.98);
        }
        body {
            font-family: monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            /* Correction mobile : retour à la ligne automatique activé */
            overflow-x: hidden;
            word-break: break-word;
            white-space: pre-wrap; 
            -webkit-font-smoothing: antialiased;
        }

        /* Barre de contrôle mobile-friendly en bas ou en haut */
        .controls-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--panel-bg);
            backdrop-filter: blur(10px);
            border-top: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px 15px;
            box-sizing: border-box;
            z-index: 1000;
            transition: transform 0.3s ease;
        }
        .controls-bar.hidden {
            transform: translateY(100%);
        }
        
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-family: system-ui, sans-serif;
            font-size: 0.85rem;
        }

        button, select {
            background-color: #334155;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            min-height: 40px; /* Confort tactile mobile */
        }
        button:active { background-color: #475569; }
        
        /* Corps du prompteur adapté mobile */
        .prompter-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px 220px 20px; /* Espace en bas pour la barre de contrôle */
            font-size: 1.4rem; /* Taille de base plus lisible sur smartphone */
            line-height: 1.6;
        }

        .song-header {
            text-align: center;
            margin-bottom: 2rem;
            font-family: system-ui, sans-serif;
            border-bottom: 2px solid #334155;
            padding-bottom: 1rem;
        }
        .song-header h1 { margin: 0 0 5px 0; font-size: 1.8rem; color: var(--accent-color); }
        .song-header h2 { margin: 0; font-size: 1rem; color: #94a3b8; font-weight: normal; }

        .line {
            min-height: 1.6em;
            margin-bottom: 0.5rem;
        }
        .chord {
            color: var(--chord-color);
            font-weight: bold;
        }

        /* Bouton flottant pour réafficher les contrôles */
        .show-controls-btn {
            position: fixed;
            bottom: 15px;
            right: 15px;
            z-index: 999;
            background: #38bdf8;
            color: #0f172a;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.4rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: none;
        }
        .show-controls-btn.hidden {
            display: none;
        }
    </style>
</head>
<body>

<button class="show-controls-btn hidden" id="showBtn" onclick="toggleControls()" title="Afficher les commandes">⚙️</button>

<div class="controls-bar" id="controlsBar">
    <div class="control-row">
        <button onclick="window.location.href='index.html'" style="background-color: #1e293b; border: 1px solid #334155;">← Retour</button>
        <span id="songTitleDisplay" style="font-weight: bold; color: #38bdf8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px;">Chargement...</span>
        <button onclick="toggleControls()" style="background-color: #1e293b; border: 1px solid #334155;">Masquer 🔽</button>
    </div>

    <div class="control-row" style="justify-content: center; gap: 15px;">
        <button id="playBtn" onclick="togglePlay()" style="background-color: #22c55e; flex: 1; font-size: 1.1rem;">▶ Play</button>
        <button onclick="resetScroll()" style="background-color: #475569;">⏮ Top</button>
    </div>
    
    <div class="control-row" style="background: rgba(15,23,42,0.5); padding: 5px 10px; border-radius: 6px;">
        <div style="display: flex; align-items: center; gap: 8px;">
            <span>Vitesse: <span id="speedVal" style="color: #38bdf8; font-weight: bold;">0.4</span></span>
            <input type="range" id="speedRange" min="0.1" max="3" step="0.1" value="0.4" style="width: 100px;" oninput="updateSpeed(this.value)">
        </div>
        <div style="display: flex; gap: 5px;">
            <button onclick="adjustFontSize(-2)" style="padding: 5px 10px;">A-</button>
            <button onclick="adjustFontSize(2)" style="padding: 5px 10px;">A+</button>
        </div>
    </div>
</div>

<div class="prompter-container" id="prompterContent">
    <div class="song-header">
        <h1 id="title">Chargement...</h1>
        <h2 id="artist">...</h2>
    </div>
    <div id="lyricsBody"></div>
</div>

<script>
    let isPlaying = false;
    let scrollSpeed = 0.4; // Vitesse de base beaucoup plus lente et confortable
    let animationFrameId = null;
    let currentFontSize = 1.4; // en rem (adapté mobile)

    async function initPrompter() {
        const urlParams = new URLSearchParams(window.location.search);
        const songId = urlParams.get('id');

        if (songId === null) {
            alert("Aucune chanson sélectionnée.");
            window.location.href = 'index.html';
            return;
        }

        try {
            const res = await fetch('songs.json');
            if (!res.ok) throw new Error("Impossible de charger les chansons");
            const songs = await res.json();
            const song = songs[songId];

            if (!song) {
                alert("Chanson introuvable.");
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('title').innerText = song.title;
            document.getElementById('artist').innerText = song.artist + (song.style ? ' • ' + song.style : '');
            document.getElementById('songTitleDisplay').innerText = song.title;

            const lyricsHTML = song.lines.map(l => {
                let formattedLine = l.text.replace(/\[(.*?)\]/g, '<span class="chord">[$1]</span>');
                return `<div class="line">${formattedLine}</div>`;
            }).join('');

            document.getElementById('lyricsBody').innerHTML = lyricsHTML;

        } catch (e) {
            document.getElementById('title').innerText = "Erreur de chargement";
            document.getElementById('artist').innerText = "Vérifie le fichier songs.json.";
        }
    }

    function step() {
        if (isPlaying) {
            window.scrollBy(0, scrollSpeed);
            animationFrameId = requestAnimationFrame(step);
        }
    }

    function togglePlay() {
        isPlaying = !isPlaying;
        const btn = document.getElementById('playBtn');
        const controls = document.getElementById('controlsBar');
        const showBtn = document.getElementById('showBtn');

        if (isPlaying) {
            btn.innerText = "⏸ Pause";
            btn.style.backgroundColor = "#ef4444";
            animationFrameId = requestAnimationFrame(step);
            
            // Masquer automatiquement la barre de contrôle pour laisser place au texte
            controls.classList.add('hidden');
            showBtn.classList.remove('hidden');
        } else {
            btn.innerText = "▶ Play";
            btn.style.backgroundColor = "#22c55e";
            cancelAnimationFrame(animationFrameId);
            controls.classList.remove('hidden');
            showBtn.classList.add('hidden');
        }
    }

    function toggleControls() {
        const controls = document.getElementById('controlsBar');
        const showBtn = document.getElementById('showBtn');
        
        controls.classList.toggle('hidden');
        showBtn.classList.toggle('hidden');
    }

    function resetScroll() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (isPlaying) togglePlay();
    }

    function updateSpeed(val) {
        scrollSpeed = parseFloat(val);
        document.getElementById('speedVal').innerText = val;
    }

    function adjustFontSize(delta) {
        currentFontSize = Math.max(0.9, currentFontSize + (delta * 0.1));
        document.getElementById('prompterContent').style.fontSize = currentFontSize + 'rem';
    }

    // Stop le défilement automatique si l'utilisateur touche l'écran pour scroller manuellement
    window.addEventListener('touchstart', () => { 
        if(isPlaying) togglePlay(); 
    });

    initPrompter();
</script>

</body>
</html>
