<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompteur - Lecture</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --text-color: #f8fafc;
            --chord-color: #38bdf8;
            --accent-color: #38bdf8;
            --panel-bg: rgba(30, 41, 59, 0.95);
        }
        body {
            font-family: monospace; /* Indispensable pour l'alignement parfait accords / paroles */
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Barre de contrôle supérieure (escamotable ou fixe) */
        .controls-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: var(--panel-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            box-sizing: border-box;
            z-index: 1000;
            transition: transform 0.3s ease;
        }
        .controls-bar.hidden {
            transform: translateY(-100%);
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-family: system-ui, sans-serif;
        }
        button, select {
            background-color: #334155;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }
        button:hover { background-color: #475569; }
        button.active { background-color: #22c55e; }
        
        /* Corps du prompteur */
        .prompter-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 120px 20px 200px 20px; /* Marge en haut pour ne pas être caché par la barre */
            white-space: pre; /* Conserve les espaces pour l'alignement des accords */
            font-size: 1.8rem; /* Taille de base ajustable */
            line-height: 1.8;
        }

        .song-header {
            text-align: center;
            margin-bottom: 3rem;
            font-family: system-ui, sans-serif;
            border-bottom: 2px solid #334155;
            padding-bottom: 1.5rem;
        }
        .song-header h1 { margin: 0 0 10px 0; font-size: 2.2rem; color: var(--accent-color); }
        .song-header h2 { margin: 0; font-size: 1.2rem; color: #94a3b8; font-weight: normal; }

        /* Lignes de texte formatées */
        .line {
            min-height: 1.8em;
        }
        /* Style des accords insérés dans le texte */
        .chord {
            color: var(--chord-color);
            font-weight: bold;
        }

        /* Bouton discret pour réafficher les contrôles si cachés */
        .show-controls-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 999;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

<div class="show-controls-btn" onclick="toggleControls()" title="Afficher/Masquer les commandes">⚙️</div>

<div class="controls-bar" id="controlsBar">
    <div class="control-group">
        <button onclick="window.location.href='index.html'">← Retour</button>
        <span id="songTitleDisplay" style="font-weight: bold; color: #38bdf8; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Chargement...</span>
    </div>
    
    <div class="control-group">
        <button id="playBtn" onclick="togglePlay()" style="background-color: #22c55e; padding: 8px 16px;">▶ Play</button>
        <button onclick="resetScroll()">⏮ Top</button>
    </div>

    <div class="control-group">
        <label>Vitesse: <span id="speedVal">1</span></label>
        <input type="range" id="speedRange" min="0.5" max="5" step="0.25" value="1" style="width: 80px;" oninput="updateSpeed(this.value)">
        
        <label>Taille:</label>
        <button onclick="adjustFontSize(-2)">A-</button>
        <button onclick="adjustFontSize(2)">A+</button>
    </div>
</div>

<div class="prompter-container" id="prompterContent">
    <div class="song-header">
        <h1 id="title">Chargement...</h1>
        <h2 id="artist">...</h2>
    </div>
    <div id="lyricsBody"></div>
</div>

<script>
    let isPlaying = false;
    let scrollSpeed = 1;
    let animationFrameId = null;
    let currentFontSize = 1.8; // en rem

    async function initPrompter() {
        const urlParams = new URLSearchParams(window.location.search);
        const songId = urlParams.get('id');

        if (songId === null) {
            alert("Aucune chanson sélectionnée.");
            window.location.href = 'index.html';
            return;
        }

        try {
            const res = await fetch('songs.json');
            if (!res.ok) throw new Error("Impossible de charger les chansons");
            const songs = await res.json();
            const song = songs[songId];

            if (!song) {
                alert("Chanson introuvable.");
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('title').innerText = song.title;
            document.getElementById('artist').innerText = song.artist + (song.style ? ' • ' + song.style : '');
            document.getElementById('songTitleDisplay').innerText = song.title;

            // Affichage des lignes avec coloration potentielle des accords entre crochets
            const lyricsHTML = song.lines.map(l => {
                // Remplace les accords entre crochets [Am] par un span stylisé coloré
                let formattedLine = l.text.replace(/\[(.*?)\]/g, '<span class="chord">[$1]</span>');
                return `<div class="line">${formattedLine}</div>`;
            }).join('');

            document.getElementById('lyricsBody').innerHTML = lyricsHTML;

        } catch (e) {
            document.getElementById('title').innerText = "Erreur de chargement";
            document.getElementById('artist').innerText = "Vérifie que le fichier songs.json est bien présent.";
        }
    }

    // Gestion du défilement automatique fluide via requestAnimationFrame
    function step() {
        if (isPlaying) {
            window.scrollBy(0, scrollSpeed);
            animationFrameId = requestAnimationFrame(step);
        }
    }

    function togglePlay() {
        isPlaying = !isPlaying;
        const btn = document.getElementById('playBtn');
        const controls = document.getElementById('controlsBar');

        if (isPlaying) {
            btn.innerText = "⏸ Pause";
            btn.style.backgroundColor = "#ef4444";
            animationFrameId = requestAnimationFrame(step);
            // Masquer automatiquement la barre de contrôle après 1 seconde pour être en plein écran immersif
            setTimeout(() => {
                if (isPlaying) controls.classList.add('hidden');
            }, 1000);
        } else {
            btn.innerText = "▶ Play";
            btn.style.backgroundColor = "#22c55e";
            cancelAnimationFrame(animationFrameId);
            controls.classList.remove('hidden');
        }
    }

    function resetScroll() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (isPlaying) togglePlay();
    }

    function updateSpeed(val) {
        scrollSpeed = parseFloat(val);
        document.getElementById('speedVal').innerText = val;
    }

    function adjustFontSize(delta) {
        currentFontSize = Math.max(1, currentFontSize + (delta * 0.1));
        document.getElementById('prompterContent').style.fontSize = currentFontSize + 'rem';
    }

    function toggleControls() {
        document.getElementById('controlsBar').classList.toggle('hidden');
    }

    // Arrêter le défilement si l'utilisateur touche l'écran pour scroller manuellement
    window.addEventListener('wheel', () => { if(isPlaying) togglePlay(); });
    window.addEventListener('touchstart', () => { /* Optionnel : laisser tourner ou stopper */ });

    initPrompter();
</script>

</body>
</html>
